name: CI / Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"
  FIREBASE_PROJECT_ID: rapbattle-e6ae7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            frontend/package-lock.json

      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Generate beat
        run: node scripts/generate-beat.mjs

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Set repo variable ENABLE_FIREBASE_DEPLOY=true after adding FIREBASE_SERVICE_ACCOUNT
    if: ${{ vars.ENABLE_FIREBASE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            frontend/package-lock.json

      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Generate beat
        run: node scripts/generate-beat.mjs

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Hosting + Functions
        run: npx firebase-tools deploy --only hosting,functions --project "$FIREBASE_PROJECT_ID" --force --non-interactive
